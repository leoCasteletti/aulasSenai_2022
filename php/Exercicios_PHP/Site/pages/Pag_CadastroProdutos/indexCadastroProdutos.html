<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleProdutos.css">
    <title># Cadastro de Produtos #</title>
</head>

<body>
    <div class="content">
        <form action="">
            <fieldset>
                <legend>Cadastro de Produtos</legend>
                <div class="row">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" name="codigo" autocomplete="off" required>
                </div>

                <div class="row">
                    <label for="fornecedor">Fornecedor</label>
                    <input type="text" id="fornecedor" name="fornecedor" autocomplete="off"  required>
                </div>

                <div class="row">
                    <label for="desc">Descrição</label>
                    <input type="text" id="desc" name="desc" autocomplete="off" required>
                </div>

                <div class="row">
                    <label for="estoque">Estoque</label>
                    <input type="number" id="estoque" name="estoque" autocomplete="off" required>
                </div>

                <div class="row">
                    <label for="pcusto">Preço de Custo</label>
                    <input type="text" id="pcusto" name="pcusto" placeholder="R$" autocomplete="off" required>
                </div>

                <div class="row">
                    <label for="pvenda">Preço de Venda</label>
                    <input type="text" id="pvenda" name="pvenda" placeholder="R$" autocomplete="off" required>
                </div>

                <div class="row"></div>

                <input type="submit" value="Enviar"> <input type="reset">
            </fieldset>            
        </form>
    </div>
</body>

</html>
