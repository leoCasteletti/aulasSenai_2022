<!DOCTYPE html>
<html lang = "pt-br">
<html>
    <head>
        <meta charset="UTF-8">
        <title>Contato - Barbearia dos Nerds</title>
        <link rel="stylesheet" href="reset.css">
        <link rel = "stylesheet" href="produtos.css">
        <link rel = "stylesheet" href="contatos.css">

    </head>

    <body>
        <div class="box">
            <header>
                <h1><img src = "logo.png" alt="Logo da Barbearia dos Nerds"></h1>
                <nav>
                    <ul>
                        <li><a href="index.html">&#127968 Home</a></li>
                        <li><a href="produtos.html">&#128304 Produtos</a></li>
                        <li><a href="contato.html">&#128222 Contato</a></li>
                    </ul>
                </nav>
            </header>
        </div>
        
        <main>
            <form method = "post" action = "resultadoformulario.php">
                <label for = "nome">Nome</label>
                <input type = "text" name="nome" id="nome" class="input-padrao" required>

                <label for = "email">E-MAIL</label>
                <input type = "email" name="email" id="email" class="input-padrao" required placeholder="seuemail@dominio.com.br">

                <label for = "telefone">Telefone</label>
                <input type = "tel" name="telefone" id="telefone" class="input-padrao" required placeholder="(XX) XXXXX-XXXX">

                <label for = "mensagem"> Mensagem </label>
                <textarea cols = "70" row = "10" name="mensagem" id = "mensagem" class = "input-padrao" required></textarea>

            <fieldset>
                <legend>Como prefere o nosso contato?</legend>

                <label for="radio-telefone">
                    <input type = "radio" value="telefone" id = "radio-telefone"> 
                    Telefone
                </label>

                <label for="radio-email">
                    <input type = "radio" value="telefone" id = "radio-email"> 
                    E-Mail
                </label>

                <label for="radio-whatsapp">
                    <input type = "radio" value="telefone" id = "radio-whatsapp" checked> 
                    WhatsApp
                </label>
            </fieldset>

            <fieldset>
                <legend>Qual horário prefere ser atendido?</legend>
                <select>
                    <option>Manhã</option>
                    <option>Tarde</option>
                    <option>Noite</option>
                </select>
            </fieldset>

            <fieldset>
            <label class="checkbox">                
                <input type="checkbox" checked>     
                Gostaria de receber nossas novidades por e-mail?           
            </label>
            </fieldset>

                <input type = "submit"  value="Enviar Formulário" class="enviar">
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Dia</th>
                        <th>Horário</th>
                    </tr>
                </thead>
                    <tr>
                        <td>Segunda - Feira</td>
                        <td>8h ~ 20h</td>
                    </tr>
                    <tr>
                        <td>Quarta - Feira</td>
                        <td>8h ~ 20h</td>
                    </tr>
                    <tr>
                        <td>Sexta - Feira</td>
                        <td>8h ~ 20h</td>
                    </tr>
            </table>
        </main>

            <footer class="bg">
                <img src="logo-branco.png" alt="Logo da Barbearia dos Nerds">

    </body>

</html>
