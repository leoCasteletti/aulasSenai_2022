<canvas width="600" height="400"></canvas>

<script>
    var screen = document.querySelector('canvas');
    var pincel = screen.getContext('2d');

    pincel.fillStyle = 'gray';
    pincel.fillRect(0, 0, 600, 400);

    var desenha = false;

    function desenhaCirculo(evento){
        if(desenha){

            var x = evento.pageX - screen.offsetLeft;
            var y = evento.pageY - screen.offsetTop;
            pincel.fillStyle = 'blue';
            pincel.beginPath();
            pincel.arc(x , y, 10, 0, 2*3.14);
            pincel.fill();
        }
            console.log(x + ",  " + y);
    }

    screen.onmousemove = desenhaCirculo;

    function habilitaDesenho(){

        desenha = true;

    }

    function desabilitaDesenho(){
        
        desenha = false;

    }

screen.onmousedown = habilitaDesenho;
screen.onmouseup = desabilitaDesenho;


</script>
