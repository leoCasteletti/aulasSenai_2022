<canvas width="1920" height="1080"></canvas>

<script>

    var screen = document.querySelector('canvas');
    var pen = screen.getContext('2d');

    var raio = 10;
    var xAleatorio;
    var yAleatorio;

    pen.fillStyle = 'lightgray';
    pen.fillRect(0, 0, 1920, 1080);

    function desenhaCirculo(x, y , raio, cor){
        pen.fillStyle = cor;
        pen.beginPath();
        pen.arc(x, y, raio, 0, 2 * Math.PI);
        pen.fill();
    }

    function limpaTela(){
        pen.clearRect(0, 0, 1920, 1080);
    }

    function desenhaAlvo(x, y){
        desenhaCirculo(x, y, raio+20, 'red');
        desenhaCirculo(x, y, raio+10, 'white');
        desenhaCirculo(x, y, raio, 'red');
    }   
    
    function sorteiaPosicao(maximo){
        return Math.floor(Math.random() * maximo);
    }

    function atualizaTela(){
        limpaTela();        
        xAleatorio = sorteiaPosicao(1920);
        yAleatorio = sorteiaPosicao(1080);
        desenhaAlvo(xAleatorio, yAleatorio);
    }   

    setInterval(atualizaTela, 1000);

    function dispara(evento){
        var x = evento.pageX - tela.offsetLeft;
        var y = evento.pageY - tela.offsetTop;

        if((x > xAleatorio - raio) && (x < xAleatorio + raio) && (y > yAleatorio - raio) && (y < xAleatorio + raio)){
            alert('acertou');
        }
    }

    tela.onclick = dispara;

</script>
