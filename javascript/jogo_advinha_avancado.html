<meta charset="utf-8">
<script>

	function pularLinha(){
		document.write("<br>");
		document.write("<br>");
	}

	function mostrar(texto){
		document.write(texto);
		pularLinha();
	}

	var numeropensado = 5;
	var chute = parseInt(prompt("Digite seu chute"));

	if(chute == numeropensado){
		mostrar("Você acertou!");
	}
	if(chute != numeropensado){
		mostrar("Você errou. O número pensado foi: " + numeropensado);
	}
</script>
