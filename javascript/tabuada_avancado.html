<meta charset="utf-8">
<script>
	function pularLinha (){
		document.write("<br>");
	}
	function mostrar (texto){
		document.write(texto);
		pularLinha();
	}

	var x = prompt("Digite qual tabuada você gostaria de saber");

	mostrar("<center><h1><u>TABUADA DO " + x + "</u></h1></center>");

	mostrar("<center>" + x + " X 1 = " + x * 1 + ";<br><br></center>");
	mostrar("<center>" + x + " X 2 = " + x * 2 + ";<br><br></center>");
	mostrar("<center>" + x + " X 3 = " + x * 3 + ";<br><br></center>");
	mostrar("<center>" + x + " X 4 = " + x * 4 + ";<br><br></center>");
	mostrar("<center>" + x + " X 5 = " + x * 5 + ";<br><br></center>");
	mostrar("<center>" + x + " X 6 = " + x * 6 + ";<br><br></center>");
	mostrar("<center>" + x + " X 7 = " + x * 7 + ";<br><br></center>");
	mostrar("<center>" + x + " X 8 = " + x * 8 + ";<br><br></center>");
	mostrar("<center>" + x + " X 9 = " + x * 9 + ";<br><br></center>");
	mostrar("<center>" + x + " X 10 = " + x * 10 + ";<br><br></center>");
</script>
