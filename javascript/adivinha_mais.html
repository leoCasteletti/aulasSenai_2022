<meta charset="utf-8">

<input/> <!-- PARA COLOCAR O QUADRADAO-->
<button>Inserir</button>

<script>
	function random(){
		return Math.round(Math.random() * declararrandom);
	}

	var numerotentativas = 3;
    var tentativaatual = 1;

	var segredo = []; //o array sempre começa do zero

	var declararrandom = prompt("Declare seu limite")
		segredo.push(random(declararrandom));
	
	var input = document.querySelector("input"); //Puxa a informação do mundo html pro mundo java
	input.focus();	

	console.log(segredo)

	function verifica(){
		var achou = false
		for(var posicao = 0; posicao < segredo.length; posicao++){ //O length vai fazer a leitura automático de tudo que tiver na variavel declarada, sem ter que ficar editando ou memorizando

		if(input.value == segredo[posicao]){
			alert("Você acertou!");	
			document.location.reload(true);	
			achou = true	
			break;			
		} 
	}

		if(achou == false){
			alert("Você errou, digite novamente.");
	}	

		if(tentativaatual == 3){

            alert("Número permitido de tentativas excedido.");
            document.location.reload(true);	
    }


		input.value = "";
		input.focus(); //na hora que você errar/acertar ou acessar a página ele já ir direto pra caixinha para escrever, ou seja, não ter que ficar clicando nele para preencher

		tentativaatual++
	}

	var button = document.querySelector("button");
	button.onclick = verifica; //Hora que eu clicar no botão ele vai executar a função //variável.onclick = função

</script>
