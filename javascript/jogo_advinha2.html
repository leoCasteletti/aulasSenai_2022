<meta charset="utf-8">
<script>

	function pularLinha(){
		document.write("<br>");
		document.write("<br>");
	}

	function mostrar(texto){
		document.write(texto);
		pularLinha();
	}

	var numeropensado = Math.round(Math.random() * 10);
	//var numeropensado = 5
	var tentativas = 1;

	while(tentativas <= 3){

		var chute = parseInt(prompt("Digite seu chute"));

		if(chute == numeropensado){

			mostrar("Você acertou, o número pensado era " + numeropensado);
			break;
		} else {

			mostrar("Você errou!")
		}

		tentativas++
	}

	mostrar("FIM")

</script>
