<meta charset="utf-8">
<script>
	function pularLinha(){
		document.write("<br>");
	}
	function mostrar(texto){
		document.write(texto);
		pularLinha();
	}

	var vitorias = parseInt(prompt("Qual o número de vitórias do seu time?"));
	var empates = parseInt(prompt("Quantos empates seu time teve?"));
	var pontos = vitorias * 3 + empates;

	mostrar("Seu time possui " + pontos + " pontos na tabela de classificação.");

	if(pontos < 30){
		mostrar("Seu time esta <b>pior</b> que o ano passado.");
	}
	if(pontos == 30){
		mostrar("Seu time esta <b>igual</b> que o ano passado.");
	}
	if(pontos > 30){
		mostrar("Seu time esta <b>melhor</b> que o ano passado.");
	}
</script>
