<meta charset="utf-8">
<script>
	function pularLinha(){
		document.write("<br><br>");
	}
	function mostrar(texto){
		document.write(texto);
		pularLinha();
	}

	var anoatual = 2022;
	var descobrimentobrasil = 1500;
	var chegadadosfilhos = 30;

	mostrar("Ja se passaram " + Math.round((anoatual - descobrimentobrasil) / chegadadosfilhos) + " gerações");
</script>
