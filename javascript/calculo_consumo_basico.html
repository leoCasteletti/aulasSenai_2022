<meta charset="utf-8">
<h3>Álcool ou Gasolina?</h3>
<script>

	var TanqueGasolina = 60
	var TanqueAlcool = 40
	var KmRodadosGasolina = 480 / TanqueGasolina
	var KmRodadosAlcool = 300 / TanqueAlcool

	document.write("O consumo do veículo na gasolina é de: " + KmRodadosGasolina + " km/l<br><br>");
	document.write("O consumo do veículo no álcool é de: " + KmRodadosAlcool + " km/l<br><br>");

	</script>
